<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SILVITE — Independent Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#0C1528"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".45" stop-color="#5EEAD4"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EAF2FF"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#818CF8" stop-opacity=".28"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.25" fill="#1A2944"/></pattern>
</defs>
<style>
  .flow{fill:none;stroke:url(#flow);stroke-width:2;stroke-linecap:round;stroke-dasharray:120 900;animation:run 6s linear infinite}
  .f2{animation-duration:8.5s;animation-delay:-3s;opacity:.7}
  .f3{animation-duration:11s;animation-delay:-6s;opacity:.45}
  @keyframes run{from{stroke-dashoffset:1020}to{stroke-dashoffset:0}}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
  .rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
  .r1{animation-delay:.05s}.r2{animation-delay:.2s}.r3{animation-delay:.32s}.r4{animation-delay:.44s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hair{transform-origin:76px 0;animation:grow 1.2s .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#dots)" opacity=".7"/>
<circle cx="1010" cy="160" r="280" fill="url(#glow)"/>
<path class="flow " d="M-20 250 C240 150 420 300 640 200 S980 60 1220 130"/>
<path class="flow f2" d="M-20 90 C300 40 480 210 720 150 S1000 280 1220 230"/>
<path class="flow f3" d="M-20 300 C260 260 520 120 780 170 S1060 40 1220 70"/>
<circle class="pulse" style="animation-delay:0s" cx="640" cy="200" r="4" fill="#5EEAD4"/><circle class="pulse" style="animation-delay:1.1s" cx="722" cy="152" r="4" fill="#5EEAD4"/><circle class="pulse" style="animation-delay:2.2s" cx="860" cy="262" r="4" fill="#5EEAD4"/><circle class="pulse" style="animation-delay:0.6s" cx="1080" cy="70" r="4" fill="#5EEAD4"/>
<g>
  <polygon points="1112.2,101.0 1112.2,219.0 1010.0,278.0 907.8,219.0 907.8,101.0 1010.0,42.0" fill="none" stroke="#5EEAD4" stroke-opacity=".55" stroke-width="1.5"/>
  <polygon points="1074.1,123.0 1074.1,197.0 1010.0,234.0 945.9,197.0 945.9,123.0 1010.0,86.0" fill="none" stroke="#818CF8" stroke-opacity=".5" stroke-width="1" stroke-dasharray="4 7"/>
  <circle cx="1010" cy="160" r="5" fill="#5EEAD4"/>
  <animateTransform attributeName="transform" type="rotate" from="0 1010 160" to="360 1010 160" dur="48s" repeatCount="indefinite"/>
</g>
<text x="76" y="150" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="88" font-weight="800" letter-spacing="12" fill="#EAF2FF">SILVITE</text>
<rect x="76" y="172" width="360" height="2" rx="1" fill="url(#hair)"/>
<text x="76" y="212" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" letter-spacing="5" fill="#5EEAD4">INDEPENDENT DEVELOPER</text>
<text x="76" y="246" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#EAF2FF">个人独立开发者</text>
</svg>
