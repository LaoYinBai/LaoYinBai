<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-label="Sdltm Writer">
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E9F9A"/><stop offset="1" stop-color="#5B5FE6"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E9F9A"/><stop offset="1" stop-color="#5B5FE6"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E9F9A" stop-opacity="0"/><stop offset=".5" stop-color="#0E9F9A" stop-opacity=".10"/><stop offset="1" stop-color="#0E9F9A" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="600" height="200" rx="18"/></clipPath>
</defs>
<style>
  .sheen{animation:sheen 8s ease-in-out infinite}
  @keyframes sheen{0%{transform:translateX(-220px)}55%,100%{transform:translateX(640px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="600" height="200" rx="18" fill="#FFFFFF"/>
<g clip-path="url(#clip)"><rect class="sheen" x="0" y="0" width="200" height="200" fill="url(#sheen)"/></g>
<rect x="0.5" y="0.5" width="599" height="199" rx="18" fill="none" stroke="#D3DEEE"/>
<rect x="28" y="22" width="44" height="3" rx="1.5" fill="url(#acc)"/>
<text x="572" y="34" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SFMono-Regular',monospace" font-size="11" letter-spacing="1.5" fill="#0E9F9A">WINDOWS 桌面工具</text>
<text x="28" y="60" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#0B1322">Sdltm Writer</text>
<text x="28" y="84" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14.5" font-weight="600" fill="#0E9F9A">SDLTM 翻译记忆转换工具</text>
<text x="28" y="116" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#44566F">把 TMX 翻译记忆转换为 Trados Studio 可打开的 .sdltm。</text>
<text x="28" y="136" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="13.5" fill="#44566F">无需安装 Trados，拖入文件即可导出。</text>
<rect x="28" y="156" width="101.2" height="24" rx="12" fill="#E7EFFA"/><text x="78.6" y="172" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SFMono-Regular',monospace" font-size="11.5" fill="#1F4E86">C# / .NET 8</text><rect x="137.20000000000002" y="156" width="65.2" height="24" rx="12" fill="#E7EFFA"/><text x="169.8" y="172" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SFMono-Regular',monospace" font-size="11.5" fill="#1F4E86">SQLite</text><rect x="210.40000000000003" y="156" width="43.6" height="24" rx="12" fill="#E7EFFA"/><text x="232.2" y="172" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono',Consolas,'SFMono-Regular',monospace" font-size="11.5" fill="#1F4E86">TMX</text>
</svg>
