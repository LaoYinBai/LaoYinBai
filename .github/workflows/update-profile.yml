# 自动刷新主页资产：每日更新 Pac-Man 贡献热力图与开发活动统计。
# 失败处理：
#   - 统计脚本失败：保留上一次提交的统计图，不阻塞其余步骤。
#   - Pac-Man 生成失败：保留上一次提交的热力图，最后仍将作业标红，便于察觉。
#   - 仅在确有文件变化时提交，且不会产生循环触发。
# 权限：仅 refresh 作业拥有 contents: write，其余为只读；不使用任何自定义 Secret。

name: update-profile

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: read

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh activity stats
        id: stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-assets.mjs

      # 上游：https://github.com/abozanona/pacman-contribution-graph
      # 已固定到具体 commit，避免上游变更直接影响本仓库。
      # 注意：该 Action 会向上游的统计端点发送用户名与游戏分数（见其 src/index.js 的 reportStats）。
      - name: Generate Pac-Man contribution graph
        id: pacman
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: LaoYinBai
          games: pacman

      - name: Copy Pac-Man SVGs into assets
        if: steps.pacman.outcome == 'success'
        run: |
          mkdir -p assets/pacman
          cp dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg assets/pacman/

      - name: Commit changed assets
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "chore(profile): refresh generated assets"
            git push
          fi

      - name: Report failures
        if: steps.stats.outcome == 'failure' || steps.pacman.outcome == 'failure'
        run: |
          echo "::warning::stats=${{ steps.stats.outcome }} pacman=${{ steps.pacman.outcome }}"
          exit 1
